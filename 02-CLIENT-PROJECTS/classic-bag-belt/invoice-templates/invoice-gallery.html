<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>پنج نمونهٔ فاکتور | کیف و کمربند کلاسیک</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9edf3;color:#0b294f;font:14px/1.6 Tahoma,"Segoe UI",sans-serif}.intro{max-width:1000px;margin:24px auto;background:white;padding:20px;border-radius:12px}.intro h1{margin:0 0 5px}.intro p{margin:0}.sheet{--primary:#092b58;--accent:#c89439;--pale:#eaf2fb;width:210mm;min-height:297mm;margin:22px auto;padding:10mm;background:#fff;box-shadow:0 8px 28px #132d4a25;position:relative;font-size:11px;break-after:page}.sheet:before{content:attr(data-sample);position:absolute;left:10mm;top:7mm;font-size:10px;color:#637285}.header{display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--accent);padding:5px 0 12px}.logo{width:86px;height:86px;object-fit:contain}.identity{flex:1}.identity h2{font-size:24px;margin:0;color:var(--primary)}.identity strong{font-size:13px}.identity p{margin:5px 0 0}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 0}.meta div{border:1px solid #aabfd5;border-radius:5px;padding:6px}.meta b{display:block;color:var(--primary)}.bank{background:var(--pale);border-right:4px solid var(--accent);padding:7px 10px;margin:5px 0 10px}.bank b{font-size:14px;direction:ltr;unicode-bidi:isolate}.bank span{display:block}.invoice-table{width:100%;border-collapse:collapse;table-layout:fixed;text-align:right}.invoice-table th,.invoice-table td{border:1px solid #9fb8d1;padding:7px}.invoice-table th{background:var(--primary);color:white}.invoice-table th:first-child{width:7%}.invoice-table th:nth-child(3){width:11%}.invoice-table tbody{height:190px;vertical-align:top}.totals{display:flex;justify-content:space-between;gap:16px;margin-top:10px}.terms{flex:1;border:1px solid #aabfd5;border-radius:5px;padding:9px}.terms h3{background:var(--primary);color:white;margin:-9px -9px 7px;padding:6px;text-align:center;font-size:13px}.terms ol{margin:0;padding-right:18px}.terms li{margin:0 0 4px}.amounts{width:195px;flex:none}.amounts div{border:1px solid #9fb8d1;padding:7px;display:flex;justify-con </style></head><body><div class="intro"><h1>پنج نمونهٔ فاکتور</h1><p>طرح‌های قابل مقایسه بر پایهٔ اطلاعات ارائه‌شدهٔ فروشگاه. شماره، مشتری و اقلام در این فایل عمداً خالی‌اند؛ این صفحه سند فروش صادرشده نیست. برای چاپ، اندازهٔ A4 و حاشیهٔ صفر را انتخاب کنید.</p></div><div id="gallery"></div><script>
const titles=['۱ · کلاسیک مرجع','۲ · تجاری مینیمال','۳ · دفتر حساب','۴ · ویترین برند','۵ · چاپ اقتصادی'];
const conditions=[
'اجناس فوق صحیح و سالم به خریدار تحویل گردید. این فاکتور سند بدهی خریدار بوده و تا تسویه کامل، اجناس نزد وی شرعاً و قانوناً امانت محسوب می‌شود.',
'خریدار موظف است تعداد، مدل، رنگ و مشخصات کالاهای دریافتی را با فاکتور تطبیق داده و هرگونه مغایرت ظاهری را در اولین فرصت به فروشنده اطلاع دهد.',
'کالاهای دارای ایراد تولید یا مغایرت با سفارش، پس از بررسی و تأیید، مطابق توافق و مقررات مربوط تعیین تکلیف می‌شوند.',
'هزینه ارسال و مسئولیت حمل کالا طبق توافق طرفین و روش ارسال درج‌شده در فاکتور تعیین می‌شود.',
'در فروش اعتباری، خریدار موظف است مانده بدهی را در تاریخ سررسید مندرج در فاکتور تسویه نماید.',
'قیمت‌ها و تخفیفات این فاکتور مختص همین معامله بوده و شامل سفارش‌های آینده نمی‌شوند.'
];
const markup=(i)=>`<section class="sheet v${i+1}" data-sample="نمونهٔ طرح ${titles[i]}"><header class="header"><img class="logo" src="../assets/originals/ClassicBag-mark.png" alt="نشان کیف و کمربند کلاسیک"><div class="identity"><h2>کیف و کمربند کلاسیک</h2><strong>استایل کامل از کیف و کمربند</strong><p>۰۵۱-۳۳۶۶۲۷۹۴ · ۰۵۱-۳۳۶۶۲۷۹۵ · ۰۹۱۰-۵۰۰-۳۶۶۹<br>مشهد، بلوار مصلی، بازار مولوی، فاز یک، طبقه فوقانی، پلاک ۱۴۰ و ۱۴۱</p></div></header><div class="bank">شمارهٔ کارت: <b>6219861034642404</b> · رضا ابراهیم‌زاده<span>حتماً فیش واریزی را به شماره همراه فوق در پیامک و یا فضای مجازی ارسال بفرمایید.</span></div><div class="meta"><div>شمارهٔ فاکتور<b>……………</b></div><div>تاریخ<b>……………</b></div><div>نام خریدار<b>……………</b></div><div>شمارهٔ تماس<b>……………</b></div><div>نشانی خریدار<b>…………………………………………</b></div><div>نحوهٔ پرداخت<b>……………</b></div><div>تاریخ سررسید<b>……………</b></div><div>توضیح ارسال<b>……………</b></div></div><table class="invoice-table"><thead><tr><th>ردیف</th><th>شرح کالا / مدل / رنگ</th><th>تعداد</th><th>فی (ریال)</th><th>تخفیف (ریال)</th><th>مبلغ (ریال)</th></tr></thead><tbody>${Array.from({length:8},(_,n)=>`<tr><td>${n+1}</td><td></td><td></td><td></td><td></td><td></td></tr>`).join('')}</tbody></table><div class="totals"><section class="terms"><h3>شرایط فروش و تحویل کالا</h3><ol>${conditions.map(c=>`<li>${c}</li>`).join('')}</ol></section><div class="amounts"><div>جمع کل <b>……………</b></div><div>تخفیف <b>……………</b></div><div>هزینهٔ ارسال <b>……………</b></div><div class="grand">مبلغ نهایی <b>……………</b></div><div>مبلغ پرداختی <b>……………</b></div><div>مانده <b>……………</b></div><div class="sign"><div>امضای خریدار</div><div>امضای فروشنده</div></div></div></div><div class="closing">لطفاً پیش از تأیید سفارش، مشخصات و تعداد کالاها را بررسی فرمایید.</div><div class="footer">با تشکر از اعتماد و همکاری شما.</div></section>`;
document.getElementById('gallery').innerHTML=titles.map((_,i)=>markup(i)).join('');
</script></body></html>
