name: Android debug compile check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 01-CORE-PLATFORM/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore private brand assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download private-assets-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern 'ios-private-assets-2026-10-21.zip' --output private-assets.zip
          echo '1FEBB3ED436FFAA7C3BFD0545313A57B86999F8634E40FB77D3E96CD6F59DB3D  private-assets.zip' | sha256sum --check
          unzip -q private-assets.zip
          test -f 02-CLIENT-PROJECTS/classic-bag-belt/brand-config/store.json
          test -f 02-CLIENT-PROJECTS/classic-bag-belt/original-assets/ClassicBag-mark.png
      - name: Test, build and sync
        working-directory: 01-CORE-PLATFORM
        run: |
          npm ci
          npm test
          npm run build
          cd apps/mobile
          npx cap sync android
      - name: Build and verify debug APK
        working-directory: 01-CORE-PLATFORM/apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt | sort -V | tail -n 1)
          test -n "$APKSIGNER" && test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          PACKAGE_INFO=$("$AAPT" dump badging "$APK" | grep '^package:')
          echo "$PACKAGE_INFO"
          echo "$PACKAGE_INFO" | grep -F "name='ir.majora.classicbag'"
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: majora-classicbag-debug-qa
          path: 01-CORE-PLATFORM/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
