name: iOS compile check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 01-CORE-PLATFORM/package-lock.json
      - name: Restore private brand assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download private-assets-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern 'ios-private-assets-2026-10-21.zip' --output private-assets.zip
          echo '1FEBB3ED436FFAA7C3BFD0545313A57B86999F8634E40FB77D3E96CD6F59DB3D  private-assets.zip' | shasum -a 256 --check
          unzip -q private-assets.zip
          test -f 02-CLIENT-PROJECTS/classic-bag-belt/brand-config/store.json
          test -f 02-CLIENT-PROJECTS/classic-bag-belt/original-assets/ClassicBag-mark.png
      - name: Test and build shared source
        working-directory: 01-CORE-PLATFORM
        run: |
          npm ci
          npm test
          npm run build
          npm run sync:ios -w @majora/mobile
      - name: Compile iOS simulator without signing
        working-directory: 01-CORE-PLATFORM/apps/mobile
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
