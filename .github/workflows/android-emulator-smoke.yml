name: Android emulator startup and SQLite smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 01-CORE-PLATFORM/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check emulator host
        run: |
          echo "Android SDK: $ANDROID_HOME"
          ls -l "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          ls -l /dev/kvm
          test -c /dev/kvm
      - name: Test, build, and sync
        working-directory: 01-CORE-PLATFORM
        run: |
          npm ci
          npm test
          npm run build
          cd apps/mobile
          npx cap sync android
      - name: Build debug APK
        working-directory: 01-CORE-PLATFORM/apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Boot emulator and verify app database
        run: bash 01-CORE-PLATFORM/tooling/android-emulator-smoke.sh 01-CORE-PLATFORM/apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Save emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-startup-diagnostics
          path: ${{ runner.temp }}/majora-emulator.log
          if-no-files-found: ignore
