name: Web candidate packages

on:
  push:
    branches: [feature/web-invoice-parity]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 01-CORE-PLATFORM/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and test the web application
        shell: pwsh
        working-directory: 01-CORE-PLATFORM
        run: |
          npm ci
          npm test
          npm run build -w @majora/web
          dotnet build apps/web-api/Majora.WebApi.csproj -c Release
          ./tooling/test-web-api.ps1 -Dotnet (Get-Command dotnet).Source
      - name: Publish Windows and Linux packages
        shell: pwsh
        working-directory: 01-CORE-PLATFORM
        run: |
          dotnet publish apps/web-api/Majora.WebApi.csproj -c Release -r win-x64 --self-contained false -o ../output/web-win-x64
          dotnet publish apps/web-api/Majora.WebApi.csproj -c Release -r linux-x64 --self-contained false -o ../output/web-linux-x64
          ./tooling/test-web-package.ps1 -PublishDirectory (Resolve-Path ../output/web-win-x64).Path -DotnetRoot (Split-Path (Get-Command dotnet).Source)
      - name: Generate reviewed SQL Server migration candidate
        shell: pwsh
        working-directory: 01-CORE-PLATFORM
        run: |
          dotnet tool install dotnet-ef --version 10.0.14 --tool-path ../output/tools
          & ../output/tools/dotnet-ef.exe migrations script --idempotent --project apps/web-api/Majora.WebApi.csproj --startup-project apps/web-api/Majora.WebApi.csproj --context MajoraDb --output ../output/majora-sqlserver-migrations.sql
      - uses: actions/upload-artifact@v4
        with:
          name: MAJORA-web-win-x64-candidate
          path: output/web-win-x64/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: MAJORA-web-linux-x64-candidate
          path: output/web-linux-x64/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: MAJORA-sqlserver-migrations-candidate
          path: output/majora-sqlserver-migrations.sql
          if-no-files-found: error
          retention-days: 30
